<button type="button"
  class="lead-move-ready-btn relative inline-flex h-9 w-9 items-center justify-center rounded-lg border border-indigo-200/80 bg-indigo-50/80 text-lg text-indigo-600 shadow-sm transition-all duration-200 hover:scale-105 hover:border-indigo-300 hover:bg-indigo-100/80 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/35"
  hx-post="{% url 'move_lead_to_ready' pk=lead.id %}"
  hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
  hx-target="#lead-grid-cell-{{ lead.id }}"
  hx-swap="delete swap:300ms"
  hx-indicator="this"
  hx-target-error="#lead-junk-error-{{ lead.id }}"
  onclick="event.stopPropagation()"
  title="Move to Ready (waiting for outreach)"
  aria-label="Move lead to Ready">
  <span class="sr-only">Move to Ready</span>
  <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
  <svg class="htmx-indicator absolute h-3.5 w-3.5 animate-spin text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
</button>
