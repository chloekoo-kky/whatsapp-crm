<div class="lead-tag-picker" role="group" aria-label="Tags">
  {% for tag in dashboard_tags %}
  <label class="lead-tag-picker-chip">
    <input type="checkbox"
      class="lead-tag-picker-cb"
      value="{{ tag.slug }}"
      {% if default_checked_slug and tag.slug == default_checked_slug %}checked{% endif %} />
    <span class="lead-tag-picker-chip-label">{{ tag.label }}</span>
  </label>
  {% empty %}
  <p class="text-xs text-slate-400">No tags yet</p>
  {% endfor %}
</div>
