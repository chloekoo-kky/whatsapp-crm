{% load clinic_display %}
<p class="clinic-sent-date-line {{ extra_class }} flex items-center gap-1 text-[11px] leading-snug text-slate-400{% if not c.whatsapp_sent_at %} hidden{% endif %}" title="Date the first WhatsApp message was sent">
  <svg class="h-3.5 w-3.5 shrink-0 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg>
  <span class="clinic-sent-date-text">{% if c.whatsapp_sent_at %}Sent {{ c.whatsapp_sent_at|campaign_datetime }}{% endif %}</span>
</p>
