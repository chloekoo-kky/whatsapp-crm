<button type="button"
  class="lead-vip-star-btn inline-flex shrink-0 rounded-lg p-1 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400/50 {{ extra_class }} {% if c.is_very_important %}text-amber-500 hover:bg-amber-50/90 hover:text-amber-600{% else %}text-slate-300 hover:bg-amber-50/80 hover:text-amber-500{% endif %}"
  data-clinic-id="{{ c.id }}"
  data-vip="{% if c.is_very_important %}true{% else %}false{% endif %}"
  aria-pressed="{% if c.is_very_important %}true{% else %}false{% endif %}"
  title="{% if c.is_very_important %}Very important — click to clear{% else %}Mark as very important{% endif %}">
  <span class="sr-only">Toggle very important</span>
  <svg class="lead-vip-icon-outline h-5 w-5 {% if c.is_very_important %}hidden{% endif %}" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.741l-4.096-2.533a.563.563 0 01-.586 0l-4.096 2.534a.562.562 0 01-.84-.741l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 00-.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z" /></svg>
  <svg class="lead-vip-icon-solid h-5 w-5 {% if not c.is_very_important %}hidden{% endif %}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005z" clip-rule="evenodd" /></svg>
</button>
