{% load clinic_display %}
{% with extra_tags=c|extra_lead_tags %}
<div class="lead-tag-chips">
  {{ c.primary_tag_slug|category_badge }}
  {% for tag in extra_tags %}
  <span class="lead-tag-chip lead-tag-chip--{{ tag.slug|tag_chip_modifier }}" data-tag-slug="{{ tag.slug }}" title="{{ tag.label }}">{{ tag.label }}</span>
  {% endfor %}
</div>
{% endwith %}
