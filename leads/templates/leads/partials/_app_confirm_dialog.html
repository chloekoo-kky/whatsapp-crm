<style>
  #app-confirm-message { white-space: pre-line; }
  #app-confirm-ok-danger { background-color: rgb(225 29 72); }
  #app-confirm-ok-danger:hover { background-color: rgb(244 63 94); }
</style>
<dialog id="app-confirm-dialog" class="z-[200] w-[calc(100%-1.5rem)] max-w-md overflow-hidden rounded-2xl border border-slate-200/90 bg-white p-0 shadow-2xl ring-1 ring-slate-900/5 backdrop:bg-slate-900/45" aria-labelledby="app-confirm-title" aria-describedby="app-confirm-message">
  <div class="flex flex-col">
    <div class="border-b border-slate-100 bg-slate-50/80 px-5 py-4">
      <h2 id="app-confirm-title" class="text-base font-semibold tracking-tight text-slate-900">Confirm</h2>
      <p id="app-confirm-message" class="mt-1 text-sm text-slate-600"></p>
    </div>
    <div class="flex flex-wrap items-center justify-end gap-2 px-5 py-4">
      <button type="button" id="app-confirm-cancel" class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 shadow-sm transition hover:bg-slate-50">Cancel</button>
      <button type="button" id="app-confirm-ok" class="rounded-xl bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-500">OK</button>
      <button type="button" id="app-confirm-ok-danger" class="hidden rounded-xl px-4 py-2 text-sm font-semibold text-white shadow-sm transition">Delete</button>
    </div>
  </div>
</dialog>
