<div id="leads-pagination-bar" class="flex min-h-[2.25rem] flex-nowrap items-center justify-end gap-1.5 sm:gap-2">
  <label class="toolbar-btn shrink-0" title="Number of leads shown per page">
    <span class="leads-control-label pl-0.5 text-slate-500">Per page</span>
    <select id="leads-per-page-select" class="max-w-[4.5rem] cursor-pointer border-0 bg-transparent py-1 pr-6 text-xs font-semibold text-slate-700 focus:outline-none focus:ring-0" aria-label="Leads per page">
      <option value="24">24</option>
      <option value="48" selected>48</option>
      <option value="96">96</option>
    </select>
  </label>
  <div id="leads-pagination-controls" class="toolbar-btn leads-pagination-controls" role="navigation" aria-label="Lead list pages">
    <button type="button" id="leads-page-prev" class="leads-page-nav-btn" aria-label="Previous page" title="Previous page">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <span id="leads-page-status" class="min-w-[2.6rem] px-0.5 text-center text-xs font-semibold tabular-nums text-slate-600" aria-live="polite">1 / 1</span>
    <button type="button" id="leads-page-next" class="leads-page-nav-btn" aria-label="Next page" title="Next page">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
</div>
