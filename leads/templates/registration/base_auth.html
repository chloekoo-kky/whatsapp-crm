<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Lead CRM{% endblock %}</title>
  {% include "leads/partials/_tailwind.html" %}
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  {% include "leads/partials/_workspace_app_styles.html" %}
  <style>
    .auth-form input:not([type="hidden"]):not([type="checkbox"]):not([type="submit"]):not([type="button"]) {
      height: 2.5rem;
      width: 100%;
      border-radius: 0.75rem;
      border: 1px solid rgb(226 232 240);
      background-color: rgb(255 255 255);
      padding: 0 0.875rem;
      font-size: 0.875rem;
      line-height: 1.25rem;
      color: rgb(15 23 42);
      box-shadow: 0 1px 2px 0 rgb(15 23 42 / 0.04);
      outline: none;
    }
    .auth-form input:focus {
      border-color: rgb(99 102 241);
      box-shadow: 0 0 0 3px rgb(99 102 241 / 0.12);
    }
    .auth-form .errorlist {
      margin: 0;
      list-style: none;
      padding: 0;
      font-size: 0.75rem;
      color: rgb(220 38 38);
    }
    .auth-form .errorlist li + li {
      margin-top: 0.25rem;
    }
  </style>
</head>
<body class="min-h-[100dvh] bg-slate-100 font-sans text-slate-900 antialiased">
  <div class="flex min-h-[100dvh] items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">
      <div class="mb-6 text-center">
        <p class="text-[1.05rem] font-bold tracking-tight text-slate-900">Lead CRM</p>
        <p class="mt-1.5 text-[10px] font-semibold uppercase tracking-[0.2em] text-slate-400">Business leads</p>
      </div>
      <div class="rounded-2xl border border-slate-200/90 bg-white p-6 shadow-sm ring-1 ring-slate-900/5 sm:p-8">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
</body>
</html>
