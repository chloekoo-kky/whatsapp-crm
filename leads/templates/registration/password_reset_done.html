{% extends "registration/base_auth.html" %}
{% block title %}Check your email — Lead CRM{% endblock %}
{% block content %}
<h1 class="text-lg font-semibold tracking-tight text-slate-900">Check your email</h1>
<p class="mt-2 text-sm leading-relaxed text-slate-500">If that address is on an account, a reset link is on its way. It can take a few minutes. Check spam if you do not see it.</p>
<p class="mt-6 text-center text-sm">
  <a href="{% url 'login' %}" class="font-medium text-indigo-600 hover:text-indigo-500">Back to sign in</a>
</p>
{% endblock %}
